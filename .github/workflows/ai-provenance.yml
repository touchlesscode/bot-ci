# required on every repo's default-branch PRs by the org ruleset "bot-ci" (with PR Lint).
# as a required workflow only its pull_request runs happen (rulesets ignore `types` and the other triggers);
# the check_run / pull_request_review triggers apply where a repo runs this file itself. so a PR picks up a
# new attestation by the touchless-bot MCP re-running failed runs on that head (update_pr / open_pr), and a
# beta-enabled PR waits for Second Look inside the job (AI_PROVENANCE_WAIT_MINUTES).
name: AI Provenance

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  pull_request_review:
    types: [submitted]
  check_run:
    types: [completed]
  merge_group:

permissions:
  contents: read
  pull-requests: read
  checks: write

concurrency:
  group: ai-provenance-${{ github.repository }}-${{ github.event.pull_request.number || github.event.check_run.pull_requests[0].number || github.run_id }}
  cancel-in-progress: true

jobs:
  provenance:
    name: AI Provenance
    runs-on: ${{ vars.BOT_CI_LIGHT_RUNNER || vars.ORG_CI_LIGHT_RUNNER || 'ubicloud-standard-2' }}
    timeout-minutes: 60
    steps:
      - uses: touchlesscode/bot-ci/actions/ai-provenance@main
        with:
          github-token: ${{ github.token }}
          mode: ${{ vars.AI_PROVENANCE_MODE }}
          wait-minutes: ${{ vars.AI_PROVENANCE_WAIT_MINUTES }}
