# required on every repo's default-branch PRs by the org ruleset "bot-ci".
# rulesets ignore trigger filters: this always runs on opened / synchronize / reopened.
# staging previews only, exo-style (wrangler env.feature, <app>-<version>.touchlessapis.com).
# the checks job runs the PR's code; its one secret, PACKAGES_READ_TOKEN (read:packages for
# @touchlesscode/*), only reaches the scripts-off install after npmrcGuard. it bundles the previews.
# the previews job never checks out the PR, refuses anything that isn't a preview, and is
# the only job with exo's CLOUDFLARE_API_TOKEN. production deploys need a push-triggered
# workflow in the repo.
name: Build

on:
  pull_request:
  merge_group:

permissions:
  actions: read
  contents: read
  packages: read

concurrency:
  group: bot-ci-${{ github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  checks:
    name: Build
    runs-on: ${{ vars.BOT_CI_RUNNER || vars.ORG_CI_RUNNER || 'ubicloud-standard-8' }}
    timeout-minutes: 30
    outputs:
      previews: ${{ steps.ci.outputs.previews }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: ci
        uses: touchlesscode/bot-ci/actions/ci@main
        with:
          github-token: ${{ github.token }}
          packages-token: ${{ secrets.PACKAGES_READ_TOKEN }}
          previews: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork != true && github.event.pull_request.user.login != 'dependabot[bot]' }}

  previews:
    name: Previews
    needs: checks
    if: needs.checks.outputs.previews == 'true'
    runs-on: ${{ vars.BOT_CI_LIGHT_RUNNER || vars.ORG_CI_LIGHT_RUNNER || 'ubicloud-standard-2' }}
    timeout-minutes: 15
    permissions:
      actions: read
      pull-requests: write
    steps:
      - uses: touchlesscode/bot-ci/actions/deploy-previews@main
        with:
          github-token: ${{ github.token }}
          cloudflare-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          cloudflare-account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          app-secrets: ${{ toJSON(secrets) }}
          preview-zone: ${{ vars.BOT_CI_PREVIEW_ZONE || vars.ORG_CI_PREVIEW_ZONE || 'touchlessapis.com' }}
