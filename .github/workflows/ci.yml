# Build is for the bot's repos: ones made from app-template, without their own CI. required on default-branch
# PRs by the org ruleset "bot-ci-build", which leaves out every repo setup.sh's scan found isn't one. rulesets
# ignore trigger filters: this always runs on opened / synchronize / reopened. the plan job decides on a light
# runner, so a human repo created since that scan never starts the build runner (a skipped job still passes).
# staging previews only, exo-style (wrangler env.feature, <app>-<version>.touchlessapis.com).
# the checks job runs the PR's code; its one secret, PACKAGES_READ_TOKEN (read:packages for
# @touchlesscode/*), only reaches the scripts-off install after npmrcGuard. it bundles the previews.
# the previews job never checks out the PR, refuses anything that isn't a preview, and is
# the only job with exo's CLOUDFLARE_API_TOKEN and the preview age key (SOPS_AGE_KEY_PREVIEW).
# the e2e job then runs the PR's Playwright tests against those previews. production deploys
# need a push-triggered workflow in the repo.
name: Build

on:
  pull_request:
  merge_group:

permissions:
  actions: read
  contents: read
  packages: read

concurrency:
  group: bot-ci-${{ github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  plan:
    name: Plan
    runs-on: ${{ vars.BOT_CI_LIGHT_RUNNER || vars.ORG_CI_LIGHT_RUNNER || 'ubicloud-standard-2' }}
    timeout-minutes: 5
    outputs:
      build: ${{ steps.plan.outputs.build }}
    steps:
      - id: plan
        uses: touchlesscode/bot-ci/actions/ci-plan@main
        with:
          github-token: ${{ github.token }}
          template: touchlesscode/app-template

  checks:
    name: Build
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: ${{ vars.BOT_CI_RUNNER || vars.ORG_CI_RUNNER || 'ubicloud-standard-8' }}
    timeout-minutes: 30
    outputs:
      previews: ${{ steps.ci.outputs.previews }}
      e2e: ${{ steps.ci.outputs.e2e }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: ci
        uses: touchlesscode/bot-ci/actions/ci@main
        with:
          github-token: ${{ github.token }}
          packages-token: ${{ secrets.PACKAGES_READ_TOKEN }}
          previews: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork != true && github.event.pull_request.user.login != 'dependabot[bot]' }}
          coverage: ${{ vars.BOT_CI_COVERAGE || 'evaluate' }}
          patch-coverage-repos: ${{ vars.BOT_CI_PATCH_COVERAGE_REPOS || '' }}

  previews:
    name: Previews
    needs: checks
    if: needs.checks.outputs.previews == 'true'
    runs-on: ${{ vars.BOT_CI_LIGHT_RUNNER || vars.ORG_CI_LIGHT_RUNNER || 'ubicloud-standard-2' }}
    timeout-minutes: 15
    permissions:
      actions: read
      pull-requests: write
    outputs:
      urls: ${{ steps.deploy.outputs.urls }}
    steps:
      - id: deploy
        uses: touchlesscode/bot-ci/actions/deploy-previews@main
        with:
          github-token: ${{ github.token }}
          cloudflare-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          cloudflare-account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          app-secrets: ${{ toJSON(secrets) }}
          preview-zone: ${{ vars.BOT_CI_PREVIEW_ZONE || vars.ORG_CI_PREVIEW_ZONE || 'touchlessapis.com' }}
          sops-age-key: ${{ secrets.SOPS_AGE_KEY_PREVIEW }}

  # the PR's Playwright tests against the previews just deployed. it runs the PR's code like Build: a fresh
  # checkout, the packages token only in the scripts-off install, no Cloudflare token, no repo secrets.
  # part of ci.yml, so bot-ci-build requires it wherever it requires Build; skipped (which passes) when the
  # repo has no test:e2e or nothing was previewed
  e2e:
    name: E2E
    needs: [checks, previews]
    if: needs.checks.outputs.e2e == 'true' && needs.previews.outputs.urls != '' && needs.previews.outputs.urls != '[]'
    runs-on: ${{ vars.BOT_CI_RUNNER || vars.ORG_CI_RUNNER || 'ubicloud-standard-8' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: touchlesscode/bot-ci/actions/ci@main
        with:
          github-token: ${{ github.token }}
          packages-token: ${{ secrets.PACKAGES_READ_TOKEN }}
          e2e-previews: ${{ needs.previews.outputs.urls }}
