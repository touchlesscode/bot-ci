name: bot-ci build
description: For repos with no pull request CI of their own — exo's pipeline (nx affected, pnpm cache, GitHub Packages) or the repo's own scripts, then bundles exo-style staging previews (wrangler env.feature) of affected Cloudflare Worker apps for the previews job. Runs the PR's code, so it gets no secrets
inputs:
  github-token:
    required: true
  previews:
    description: "'true' to bundle previews (same-repo pull requests, not dependabot)"
    required: false
    default: "false"
outputs:
  previews:
    description: "'true' when there are preview bundles for the previews job"
    value: ${{ steps.bundle.outputs.previews }}
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v6
      with:
        node-version: 24
    - id: plan
      shell: bash
      run: node "$GITHUB_ACTION_PATH/planChecks.ts"
    - if: steps.plan.outputs.skip != 'true' && steps.plan.outputs.nx == 'true'
      uses: nrwl/nx-set-shas@v5
      with:
        main-branch-name: ${{ github.event.repository.default_branch }}
    - if: steps.plan.outputs.skip != 'true' && steps.plan.outputs.package-manager == 'pnpm'
      uses: pnpm/action-setup@v6
      with:
        version: ${{ steps.plan.outputs.pnpm-version }}
        run_install: false
    - if: steps.plan.outputs.skip != 'true'
      uses: actions/setup-node@v6
      with:
        node-version: ${{ steps.plan.outputs.node-version }}
        node-version-file: ${{ steps.plan.outputs.node-version-file }}
        cache: ${{ steps.plan.outputs.cache }}
        registry-url: https://npm.pkg.github.com
        scope: "@touchlesscode"
    - if: steps.plan.outputs.skip != 'true'
      shell: bash
      env:
        INSTALL: ${{ steps.plan.outputs.install }}
        CHECKS: ${{ steps.plan.outputs.checks }}
        NODE_AUTH_TOKEN: ${{ inputs.github-token }}
      run: bash "$GITHUB_ACTION_PATH/runChecks.sh"
    - id: bundle
      if: steps.plan.outputs.skip != 'true' && github.event_name == 'pull_request' && inputs.previews == 'true'
      shell: bash
      env:
        NODE_AUTH_TOKEN: ${{ inputs.github-token }}
        BOT_CI_NX: ${{ steps.plan.outputs.nx }}
        BOT_CI_PACKAGE_MANAGER: ${{ steps.plan.outputs.package-manager }}
        BOT_CI_PREVIEWS_DIRECTORY: ${{ runner.temp }}/bot-ci-previews
      run: node "$GITHUB_ACTION_PATH/bundlePreviews.ts"
    - if: steps.bundle.outputs.previews == 'true'
      uses: actions/upload-artifact@v5
      with:
        name: bot-ci-previews
        path: ${{ runner.temp }}/bot-ci-previews
        retention-days: 3
        if-no-files-found: error
        overwrite: true
