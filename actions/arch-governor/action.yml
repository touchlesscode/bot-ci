name: arch-governor
description: Read-only architecture review of bot-authored pull requests by the other model family; fails on a "block" verdict
inputs:
  github-token:
    required: true
  anthropic-api-key:
    required: false
  openai-api-key:
    required: false
  anthropic-model:
    required: false
  openai-model:
    required: false
  scope:
    description: "bot (default): only PRs the bot opened; all: every PR"
    required: false
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v6
      with:
        node-version: 24
    - shell: bash
      run: node "$GITHUB_ACTION_PATH/review.ts"
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key }}
        OPENAI_API_KEY: ${{ inputs.openai-api-key }}
        ARCH_GOVERNOR_ANTHROPIC_MODEL: ${{ inputs.anthropic-model }}
        ARCH_GOVERNOR_OPENAI_MODEL: ${{ inputs.openai-model }}
        ARCH_GOVERNOR_SCOPE: ${{ inputs.scope }}
        ARCH_GOVERNOR_DEFAULT_RULES: ${{ github.action_path }}/rules.md
