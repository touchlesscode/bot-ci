name: bot-ci coverage
description: The coverage gate (coverageGate.ts) on lcov reports the repo's tests already wrote (`<project>/coverage/lcov.info`). Build runs it after its checks; a shared repo with CI of its own adds it after its coverage run to get patch coverage, 100% of the lines a PR adds or edits. Reads data only, runs nothing from the repo, needs no token
inputs:
  mode:
    description: "full (100% overall), patch (100% of changed lines) or auto (full, except repos in patch-repos)"
    required: false
    default: auto
  enforcement:
    description: "enforce fails the step; evaluate (default) only reports; off skips. Build passes the org variable BOT_CI_COVERAGE"
    required: false
    default: evaluate
  base:
    description: "the commit to diff against (the PR's base sha); needs a checkout with that history (fetch-depth: 0)"
    required: false
    default: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
  patch-repos:
    description: "comma-separated repo names auto treats as shared (patch); empty is coverageModeOf's default, apps"
    required: false
    default: ""
outputs:
  passed:
    description: "'true' when coverage met the mode's bar"
    value: ${{ steps.gate.outputs.passed }}
runs:
  using: composite
  steps:
    - id: gate
      shell: bash
      env:
        BOT_CI_COVERAGE: ${{ inputs.enforcement }}
        BOT_CI_COVERAGE_MODE: ${{ inputs.mode }}
        BOT_CI_COVERAGE_BASE: ${{ inputs.base }}
        BOT_CI_PATCH_COVERAGE_REPOS: ${{ inputs.patch-repos }}
      run: node "$GITHUB_ACTION_PATH/coverageGate.ts"
