name: Second Look (beta)
description: "Second Look's steps outside the testers, in the private second-look repo's dispatched run. prepare: fetch the PR, open its check, wait for its previews and bundle its files and diff for the testers (never runs PR code). synthesize: the main reviewer, a read-only agent on the base branch that reads the PR's Jira ticket and linked designs, the code around the change and the repo's docs, reviews the diff, folds in both testers' reports, leaves its findings as inline comments on the diff, posts one sticky summary comment and closes the check. abandon: closes the check and tells the PR when the run ended without a review."
inputs:
  step:
    description: "prepare, synthesize or abandon"
    required: true
  github-token:
    description: "a Touchless Bot App token for the PR's repo only. prepare: contents + pull-requests read; synthesize: contents read, issues + pull-requests write (posting falls back to it when post-token is blank, and it re-requests clanker-in-chief after the inline review); abandon: issues write, for the didn't-finish reply when post-token is blank"
    required: false
  checks-token:
    description: "a Touchless Bot App token with checks write on the PR's repo, minted on its own so a missing Checks permission only means no check. blank: no check"
    required: false
  post-token:
    description: "synthesize, abandon: clanker-in-chief's classic PAT (repo), so the review, its inline comments and the didn't-finish reply come from that user. without it the App posts as touchless-bot[bot]"
    required: false
  repository:
    description: "the PR's repo, owner/name"
    required: true
  number:
    description: "the PR number"
    required: false
  requested-by:
    description: "the GitHub login that asked for it"
    required: false
  head-sha:
    description: "synthesize: the commit prepare bundled, so both look at the same one"
    required: false
  check-run-id:
    description: "synthesize, abandon: the check prepare opened"
    required: false
  result:
    description: "abandon: the reviewer job's result (cancelled, failure, skipped)"
    required: false
  stage:
    description: "abandon: where the run stopped, prepare or review"
    required: false
  preview-wait-minutes:
    description: "prepare: how long to wait for the head commit's preview deploys (default 10)"
    required: false
  anthropic-api-key:
    required: false
  openai-api-key:
    required: false
  anthropic-model:
    required: false
  openai-model:
    required: false
  mode:
    description: "advisory (default): the check is never red; enforce: a block or a failed review turns it red"
    required: false
  budget-usd:
    description: "the Claude reviewer's spend cap per run (default 3)"
    required: false
  jira-url:
    required: false
  jira-email:
    description: "the bot's Jira user (default bot@touchless.io)"
    required: false
  jira-api-token:
    description: "that user's Jira API token, to read the PR's ticket"
    required: false
  jira-projects:
    description: "comma list of Jira project keys to look for (default EXO)"
    required: false
  figma-token:
    description: "a Figma token, to read frames linked from the PR or ticket"
    required: false
outputs:
  head-sha:
    value: ${{ steps.pull.outputs.head-sha }}
  check-run-id:
    value: ${{ steps.check.outputs.check-run-id }}
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v6
      with:
        node-version: 24
    - id: pull
      if: inputs.step != 'abandon'
      shell: bash
      run: node "$GITHUB_ACTION_PATH/fetchPull.ts"
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        SECOND_LOOK_REPOSITORY: ${{ inputs.repository }}
        SECOND_LOOK_NUMBER: ${{ inputs.number }}
        SECOND_LOOK_HEAD_SHA: ${{ inputs.head-sha }}
        SECOND_LOOK_EVENT_PATH: ${{ runner.temp }}/second-look-bundle/event.json
    - id: check
      if: inputs.step == 'prepare' && inputs.checks-token != ''
      shell: bash
      run: node "$GITHUB_ACTION_PATH/checkRun.ts" start
      env:
        GITHUB_TOKEN: ${{ inputs.checks-token }}
        SECOND_LOOK_REPOSITORY: ${{ inputs.repository }}
        SECOND_LOOK_HEAD_SHA: ${{ steps.pull.outputs.head-sha }}
        SECOND_LOOK_REQUESTED_BY: ${{ inputs.requested-by }}
    - if: inputs.step != 'abandon'
      uses: actions/checkout@v7
      with:
        repository: ${{ inputs.repository }}
        ref: ${{ steps.pull.outputs.base-sha }}
        token: ${{ inputs.github-token }}
        fetch-depth: 0
        persist-credentials: false
        path: ${{ inputs.step == 'prepare' && 'second-look-source' || '' }}
    - if: inputs.step != 'abandon'
      shell: bash
      working-directory: ${{ inputs.step == 'prepare' && 'second-look-source' || '.' }}
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        PULL_NUMBER: ${{ inputs.number }}
        HEAD_SHA: ${{ steps.pull.outputs.head-sha }}
      run: |
        basic="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 | tr -d '\n')"
        git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $basic" fetch --no-tags --quiet origin "+refs/pull/$PULL_NUMBER/head:refs/remotes/origin/second-look-head"
        git cat-file -e "$HEAD_SHA^{commit}" || { echo "::error::$HEAD_SHA isn't on the PR any more (force-pushed?); ask again"; exit 1; }
    - if: inputs.step == 'prepare'
      shell: bash
      run: node "$GITHUB_ACTION_PATH/awaitPreviews.ts"
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        SECOND_LOOK_EVENT_PATH: ${{ runner.temp }}/second-look-bundle/event.json
        SECOND_LOOK_PREVIEW_WAIT_MINUTES: ${{ inputs.preview-wait-minutes }}
        SECOND_LOOK_PREVIEWS_FILE: ${{ runner.temp }}/second-look-bundle/previews.json
    - if: inputs.step == 'prepare'
      shell: bash
      working-directory: second-look-source
      env:
        BUNDLE: ${{ runner.temp }}/second-look-bundle
        BASE_SHA: ${{ steps.pull.outputs.base-sha }}
        HEAD_SHA: ${{ steps.pull.outputs.head-sha }}
      run: |
        git diff --no-color "$BASE_SHA...$HEAD_SHA" > "$BUNDLE/pr.diff"
        git diff --no-color --stat=160 "$BASE_SHA...$HEAD_SHA" > "$BUNDLE/pr.stat"
        git archive --format=tar "$HEAD_SHA" | gzip -6 > "$BUNDLE/source.tar.gz"
        echo "bundle: $(du -h "$BUNDLE/source.tar.gz" | cut -f1) of files at ${HEAD_SHA:0:7}, $(wc -l < "$BUNDLE/pr.diff") diff lines"
    - if: inputs.step == 'prepare'
      uses: actions/upload-artifact@v5
      with:
        name: second-look-bundle
        path: ${{ runner.temp }}/second-look-bundle
        retention-days: 1
    - if: inputs.step == 'synthesize'
      shell: bash
      run: npm install --global --no-audit --no-fund --loglevel=error @anthropic-ai/claude-code @openai/codex
    - if: inputs.step == 'synthesize'
      uses: actions/download-artifact@v6
      continue-on-error: true
      with:
        pattern: second-look-report-*
        merge-multiple: true
        path: ${{ runner.temp }}/second-look-reports
    - if: inputs.step == 'synthesize'
      shell: bash
      run: node "$GITHUB_ACTION_PATH/gatherContext.ts"
      env:
        SECOND_LOOK_EVENT_PATH: ${{ runner.temp }}/second-look-bundle/event.json
        SECOND_LOOK_JIRA_URL: ${{ inputs.jira-url }}
        SECOND_LOOK_JIRA_EMAIL: ${{ inputs.jira-email }}
        SECOND_LOOK_JIRA_API_TOKEN: ${{ inputs.jira-api-token }}
        SECOND_LOOK_JIRA_PROJECTS: ${{ inputs.jira-projects }}
        SECOND_LOOK_FIGMA_TOKEN: ${{ inputs.figma-token }}
        SECOND_LOOK_CONTEXT_DIRECTORY: ${{ runner.temp }}/second-look-inputs/context
    - if: inputs.step == 'synthesize'
      shell: bash
      run: node "$GITHUB_ACTION_PATH/synthesize.ts"
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        SECOND_LOOK_CHECKS_TOKEN: ${{ inputs.checks-token }}
        SECOND_LOOK_POST_TOKEN: ${{ inputs.post-token }}
        SECOND_LOOK_EVENT_PATH: ${{ runner.temp }}/second-look-bundle/event.json
        SECOND_LOOK_CHECK_RUN_ID: ${{ inputs.check-run-id }}
        SECOND_LOOK_REQUESTED_BY: ${{ inputs.requested-by }}
        SECOND_LOOK_CONTEXT_DIRECTORY: ${{ runner.temp }}/second-look-inputs/context
        SECOND_LOOK_ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key }}
        SECOND_LOOK_OPENAI_API_KEY: ${{ inputs.openai-api-key }}
        SECOND_LOOK_ANTHROPIC_MODEL: ${{ inputs.anthropic-model }}
        SECOND_LOOK_OPENAI_MODEL: ${{ inputs.openai-model }}
        SECOND_LOOK_MODE: ${{ inputs.mode }}
        SECOND_LOOK_BUDGET_USD: ${{ inputs.budget-usd }}
        SECOND_LOOK_REPORTS_DIRECTORY: ${{ runner.temp }}/second-look-reports
        SECOND_LOOK_DEFAULT_RULES: ${{ github.action_path }}/rules.md
    - if: inputs.step == 'abandon' && inputs.checks-token != '' && inputs.check-run-id != ''
      shell: bash
      run: node "$GITHUB_ACTION_PATH/checkRun.ts" abandon
      env:
        GITHUB_TOKEN: ${{ inputs.checks-token }}
        SECOND_LOOK_REPOSITORY: ${{ inputs.repository }}
        SECOND_LOOK_CHECK_RUN_ID: ${{ inputs.check-run-id }}
        SECOND_LOOK_RESULT: ${{ inputs.result }}
    - if: inputs.step == 'abandon' && inputs.result != 'cancelled' && inputs.repository != ''
      shell: bash
      run: node "$GITHUB_ACTION_PATH/notifyUnfinished.ts"
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        SECOND_LOOK_POST_TOKEN: ${{ inputs.post-token }}
        SECOND_LOOK_REPOSITORY: ${{ inputs.repository }}
        SECOND_LOOK_NUMBER: ${{ inputs.number }}
        SECOND_LOOK_RESULT: ${{ inputs.result }}
        SECOND_LOOK_STAGE: ${{ inputs.stage }}
